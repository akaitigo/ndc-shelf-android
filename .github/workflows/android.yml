name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 20 * * 1"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # CIスクリプトとワークフローの誤りは「検査対象ゼロで成功」という形で
  # 静かに漏れる。実際にAction固定検査とOSVスキャンが空振りしていたため、
  # 静的解析をゲートに入れる。
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: |
          if ! command -v shellcheck >/dev/null; then
            echo "shellcheck is not available on this runner." >&2
            exit 1
          fi
          shellcheck .github/scripts/*.sh

      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" actionlint
          ./actionlint

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify
        run: >-
          ./gradlew
          verifyV06ReleaseConfiguration
          verifyBackupPolicy
          verifyLicenseReport
          :app:cyclonedxDirectBom
          verifyRoborazziStandardDebug
          lintStandardDebug
          assembleStandardDebug
          assembleStandardDebugAndroidTest
          assembleAiDebug
          lintAiDebug
          --stacktrace

      - name: Verify translation keys match across locales
        run: .github/scripts/verify-translations.sh

      - name: Verify exported Room schemas are committed
        run: git diff --exit-code -- app/schemas

      - name: Upload screenshot comparison on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: app/roborazzi/
          if-no-files-found: error
          retention-days: 30

      - name: Verify vulnerability exceptions
        run: .github/scripts/verify-osv-exceptions.sh

      - name: Verify action references are immutable
        run: .github/scripts/verify-action-pins.sh

      # upload-artifact に複数pathを渡すと共通の親ディレクトリが剥がされ、
      # 参照側のパスが暗黙に決まってしまう。平坦な1ディレクトリへ集約し、
      # 受け取り側が固定パスで検証できるようにする。
      - name: Collect release compliance artifacts
        run: |
          mkdir -p release-compliance
          cp app/build/reports/cyclonedx/ndc-shelf.cdx.json release-compliance/
          cp app/build/reports/licenses/THIRD-PARTY-NOTICES.json release-compliance/

      - name: Verify release compliance artifacts
        run: .github/scripts/verify-compliance-artifacts.sh release-compliance

      - name: Upload release compliance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-compliance
          path: release-compliance/
          if-no-files-found: error
          retention-days: 30

  android-test:
    name: android-test (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 35]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: ./gradlew connectedStandardDebugAndroidTest --stacktrace --no-configuration-cache --console=plain || { echo "::group::Crash logcat"; adb logcat -d -s AndroidRuntime:E E2E_DIAG:D TestRunner:I; echo "::endgroup::"; exit 1; }

  update-install:
    name: update-install (v0.1.2 -> current)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build the current debug APK
        run: ./gradlew :app:assembleStandardDebug --console=plain

      - name: Build the v0.1.2 baseline debug APK
        run: |
          # 同一ジョブ内なので ~/.android/debug.keystore を共有し、更新インストールの
          # 署名互換をそのまま検証できる。
          # v0.1.2 時点には product flavor が無いため、baseline 側は
          # フレーバー無しのタスク名と出力パスを使う。
          git worktree add "$RUNNER_TEMP/baseline" "$BASELINE_COMMIT"
          (cd "$RUNNER_TEMP/baseline" && ./gradlew :app:assembleDebug --console=plain)
          cp "$RUNNER_TEMP/baseline/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/baseline.apk"
        env:
          BASELINE_COMMIT: d852975025bf5d224e29f5b9fc475cf8c0bff957

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify the update install keeps app data
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: .github/scripts/verify-update-install.sh "$RUNNER_TEMP/baseline.apk" app/build/outputs/apk/standard/debug/app-standard-debug.apk

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: true
          vulnerability-check: true
          show-openssf-scorecard: true

  osv-scan:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release compliance artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-compliance
          path: release-compliance

      - name: Verify release compliance artifacts
        run: .github/scripts/verify-compliance-artifacts.sh release-compliance

      # 脆弱性が見つかると非ゼロ終了するため、判定は後段のreporterへ委ねる。
      # ただし対象ファイルが無い場合も同じく非ゼロで隠れるので、
      # 直前の検証と直後の出力チェックで空振りを塞ぐ。
      - name: Scan SBOM with OSV
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            -L=release-compliance/ndc-shelf.cdx.json
            --config=osv-scanner.toml

      - name: Verify OSV produced results
        run: |
          if [[ ! -s osv-results.json ]]; then
            echo "OSV scanner produced no results file; the scan did not run." >&2
            exit 1
          fi

      - name: Enforce vulnerability policy
        uses: google/osv-scanner-action/osv-reporter-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --output=osv-results.sarif
            --new=osv-results.json
            --gh-annotations=true
            --fail-on-vuln=true

      - name: Upload OSV SARIF artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-scanner-sarif
          path: osv-results.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Publish OSV findings to code scanning
        if: >-
          ${{ !cancelled() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@cdefb33c0f6224e58673d9004f47f7cb3e328b89 # v4.31.10
        with:
          sarif_file: osv-results.sarif

  publish-compliance:
    if: github.event_name == 'release'
    needs: [verify, osv-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # 検証スクリプトを使うためにリポジトリが必要。
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release compliance artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-compliance
          path: release-compliance

      - name: Verify release compliance artifacts
        run: .github/scripts/verify-compliance-artifacts.sh release-compliance

      - name: Attach SBOM and notices to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          release-compliance/ndc-shelf.cdx.json
          release-compliance/THIRD-PARTY-NOTICES.json
          --clobber
