name: Release APK

# 配布物は署名付きAPKで、GitHub Releasesからのみ提供する（ストア配布は行わない）。
# 署名付きAPKはGitHub Releaseの公開（承認済みタグ）からだけ生成する。
# 署名secretはrelease environmentに置き、fork PRやpull_requestイベントへは渡さない。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Verify release identity matches the tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: .github/scripts/verify-release-tag.sh "$RELEASE_TAG"

      - name: Restore upload keystore from secrets
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.NDC_SHELF_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::NDC_SHELF_UPLOAD_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Verify and build signed release
        env:
          NDC_SHELF_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          NDC_SHELF_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.NDC_SHELF_UPLOAD_KEYSTORE_PASSWORD }}
          NDC_SHELF_UPLOAD_KEY_ALIAS: ${{ secrets.NDC_SHELF_UPLOAD_KEY_ALIAS }}
          NDC_SHELF_UPLOAD_KEY_PASSWORD: ${{ secrets.NDC_SHELF_UPLOAD_KEY_PASSWORD }}
        run: >-
          ./gradlew
          verifyV04ReleaseConfiguration
          verifyBackupPolicy
          verifyLicenseReport
          :app:cyclonedxDirectBom
          testDebugUnitTest
          lintDebug
          :app:assembleRelease
          :app:bundleRelease
          :app:verifyReleaseBundleSize
          --stacktrace

      - name: Verify the APK is signed with the expected key
        run: |
          # 利用者は署名でしか配布元を確認できないため、APKのAPK Signature Scheme
          # 検証と証明書のSHA-256を必ず出力し、リリースノートの記載と照合できるようにする。
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs --verbose \
            app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -q "Verifies" "$RUNNER_TEMP/apk-signature.txt"
          grep -qi "certificate SHA-256 digest" "$RUNNER_TEMP/apk-signature.txt"

      - name: Collect release artifacts and checksums
        run: |
          mkdir -p release-artifacts
          # 配布物はAPK。AABはストア配布へ切り替える場合に備えた予備成果物として残す。
          cp app/build/outputs/apk/release/app-release.apk \
            "release-artifacts/ndc-shelf-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "release-artifacts/ndc-shelf-${GITHUB_REF_NAME}.aab"
          cp "$RUNNER_TEMP/apk-signature.txt" \
            "release-artifacts/apk-signature-${GITHUB_REF_NAME}.txt"
          cp app/build/outputs/mapping/release/mapping.txt \
            "release-artifacts/mapping-${GITHUB_REF_NAME}.txt"
          cp app/build/reports/cyclonedx/ndc-shelf.cdx.json release-artifacts/
          cp app/build/reports/licenses/THIRD-PARTY-NOTICES.json release-artifacts/
          (cd release-artifacts && sha256sum -- * > SHA256SUMS.txt)
          cat release-artifacts/SHA256SUMS.txt

      - name: Upload artifacts to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          release-artifacts/*
          --clobber

      - name: Upload artifacts for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-apk
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
